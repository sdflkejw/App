<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videoplayer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player" id="player">
    <video id="video" preload="metadata">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
      Ihr Browser unterstützt kein HTML5-Video.
    </video>

    <div class="overlay" id="overlay">
      <button class="play-big" id="playBig" aria-label="Play">&#9654;</button>
    </div>

    <div class="controls" id="controls">
      <div class="progress-bar" id="progressBar">
        <div class="progress-buffered" id="progressBuffered"></div>
        <div class="progress-filled" id="progressFilled"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>

      <div class="controls-bottom">
        <div class="controls-left">
          <button class="btn" id="playBtn" aria-label="Play/Pause">
            <svg id="iconPlay" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>

          <button class="btn" id="muteBtn" aria-label="Stumm">
            <svg id="iconVol" viewBox="0 0 24 24">
              <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
              <path d="M15.54,8.46a5,5,0,0,1,0,7.07"/>
              <path d="M19.07,4.93a10,10,0,0,1,0,14.14"/>
            </svg>
            <svg id="iconMute" viewBox="0 0 24 24" class="hidden">
              <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
              <line x1="23" y1="9" x2="17" y2="15"/>
              <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          </button>

          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke" />

          <span class="time" id="time">0:00 / 0:00</span>
        </div>

        <div class="controls-right">
          <button class="btn" id="pipBtn" aria-label="Picture in Picture" title="Picture in Picture">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1"/></svg>
          </button>
          <button class="btn" id="fullscreenBtn" aria-label="Vollbild">
            <svg id="iconExpand" viewBox="0 0 24 24"><polyline points="15,3 21,3 21,9"/><polyline points="9,21 3,21 3,15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            <svg id="iconShrink" viewBox="0 0 24 24" class="hidden"><polyline points="4,14 10,14 10,20"/><polyline points="20,10 14,10 14,4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
